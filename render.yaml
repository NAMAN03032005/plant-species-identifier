# Render Infrastructure as Code (Blueprint) Specification for LeafScan
services:
  - type: web
    name: leafscan-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --timeout 120 --workers 1 --threads 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FRONTEND_ORIGIN
        value: http://localhost:5173
  - type: static
    name: leafscan-frontend
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://plant-species-identifier.onrender.com

